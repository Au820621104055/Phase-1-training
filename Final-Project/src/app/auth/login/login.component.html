<div class="container mt-5"> <div class="row justify-content-center"> <div class="col-md-5"> <div class="card p-4"> <h4 class="mb-3">Login</h4> <form (ngSubmit)="onSubmit()"> <div class="mb-3"> <input type="email" class="form-control" placeholder="Email" [(ngModel)]="email" name="email" required /> </div> <div class="mb-3"> <input type="password" class="form-control" placeholder="Password" [(ngModel)]="password" name="password" required /> </div> <div *ngIf="error" class="alert alert-danger">{{ error }}</div> <button class="btn btn-primary w-100">Login</button> </form> <div class="mt-3 text-center"> <a routerLink="/register">Create account</a> </div> </div> </div> </div></div>
