<div class="container mt-5"> <div class="row justify-content-center"> <div class="col-md-6"> <div class="card p-4"> <h4 class="mb-3">Register</h4> <form (ngSubmit)="onSubmit()"> <div class="mb-3"><input class="form-control" placeholder="Name" [(ngModel)]="name" name="name" required></div> <div class="mb-3"><input type="email" class="form-control" placeholder="Email" [(ngModel)]="email" name="email" required></div> <div class="mb-3"><input type="password" class="form-control" placeholder="Password" [(ngModel)]="password" name="password" required></div> <div class="mb-3"> <select class="form-select" [(ngModel)]="role" name="role"> <option value="Customer">Customer</option> <option value="Restaurant">Restaurant</option> </select> </div> <div *ngIf="error" class="alert alert-danger">{{error}}</div> <div *ngIf="success" class="alert alert-success">{{success}}</div> <button class="btn btn-success w-100">Register</button> </form> <div class="mt-3 text-center"><a routerLink="/login">Already have an account? Login</a></div> </div> </div> </div></div>
