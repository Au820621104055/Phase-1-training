<div class="register-background">
  <div class="register-card">
    <h2>Register</h2>
    <form #registerForm="ngForm" (ngSubmit)="registerForm.valid && onSubmit()">

      <div class="mb-3">
        <label>Full Name</label>
        <input
          type="text"
          [(ngModel)]="user.fullName"
          name="fullName"
          class="form-control"
          placeholder="Enter full name"
          required
          minlength="3"
          #fullName="ngModel"
        />
        <div class="text-danger small" *ngIf="fullName.invalid && fullName.touched">
          <span *ngIf="fullName.errors?.['required']">Full name is required</span>
          <span *ngIf="fullName.errors?.['minlength']">Name must be at least 3 characters</span>
        </div>
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="user.email"
          name="email"
          class="form-control"
          placeholder="Enter email"
          required
          email
          #email="ngModel"
        />
        <div class="text-danger small" *ngIf="email.invalid && email.touched">
          <span *ngIf="email.errors?.['required']">Email is required</span>
          <span *ngIf="email.errors?.['email']">Enter a valid email address</span>
        </div>
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="user.password"
          name="password"
          class="form-control"
          placeholder="Enter password"
          required
          minlength="5"
          #password="ngModel"
        />
        <div class="text-danger small" *ngIf="password.invalid && password.touched">
          <span *ngIf="password.errors?.['required']">Password is required</span>
          <span *ngIf="password.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="mb-3">
        <label>Phone Number</label>
        <input
          type="text"
          [(ngModel)]="user.phoneNumber"
          name="phoneNumber"
          class="form-control"
          placeholder="Enter phone number"
          required
          pattern="^[0-9]{10}$"
          #phoneNumber="ngModel"
        />
        <div class="text-danger small" *ngIf="phoneNumber.invalid && phoneNumber.touched">
          <span *ngIf="phoneNumber.errors?.['required']">Phone number is required</span>
          <span *ngIf="phoneNumber.errors?.['pattern']">Enter a valid 10-digit phone number</span>
        </div>
      </div>

      <div class="mb-3">
        <label>Role</label>
        <select
          [(ngModel)]="user.role"
          name="role"
          class="form-select"
          required
          #role="ngModel"
        >
          <option value="" disabled>Select role</option>
          <option value="Customer">Customer</option>
          <option value="RestaurantOwner">Restaurant Owner</option>
          <option value="DeliveryStaff">Delivery Staff</option>
          <option value="Admin">Admin</option>
        </select>
        <div class="text-danger small" *ngIf="role.invalid && role.touched">
          <span *ngIf="role.errors?.['required']">Role selection is required</span>
        </div>
      </div>

      <p *ngIf="error" class="text-danger">{{ error }}</p>

      <button type="submit" class="btn btn-success w-100" [disabled]="registerForm.invalid">
        Register
      </button>
    </form>
  </div>
</div>
