<div class="register-background">
  <div class="register-card">
    <h2>Register</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="user.fullName" name="fullName" class="form-control" placeholder="Enter full name" required />
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input type="email" [(ngModel)]="user.email" name="email" class="form-control" placeholder="Enter email" required />
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input type="password" [(ngModel)]="user.password" name="password" class="form-control" placeholder="Enter password" required />
      </div>

      <div class="mb-3">
        <label>Phone Number</label>
        <input type="text" [(ngModel)]="user.phoneNumber" name="phoneNumber" class="form-control" placeholder="Enter phone number" />
      </div>

      <div class="mb-3">
        <label>Role</label>
        <select [(ngModel)]="user.role" name="role" class="form-select">
          <option value="Customer">Customer</option>
          <option value="RestaurantOwner">Restaurant Owner</option>
          <option value="DeliveryStaff">Delivery Staff</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <button type="submit" class="btn btn-success w-100">Register</button>
      <p *ngIf="error" class="text-danger">{{ error }}</p>
    </form>
  </div>
</div>
