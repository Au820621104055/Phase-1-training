<div class="card p-3 mb-4">
  <h4>Orders</h4>

  <table class="table table-bordered" *ngIf="orders.length">
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Date</th>
        <th>Status</th>
        <th>Items</th>
        <th>Update Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.orderId }}</td>
        <td>{{ order.orderDate | date:'short' }}</td>
        <td>{{ order.deliveryStatus }}</td>
        <td>
          <ul>
            <li *ngFor="let item of order.orderdetail">
              {{ item.itemName }} x {{ item.quantity }} = ₹{{ item.price * item.quantity }}
            </li>
          </ul>
        </td>
        <td>
          <select #statusSelect class="form-select" [value]="order.deliveryStatus">
            <option>Pending</option>
            <option>Preparing</option>
            <option>Delivered</option>
            <option>Cancelled</option>
          </select>
          <button class="btn btn-sm btn-success mt-1" (click)="updateOrderStatus(order.orderId, statusSelect.value)">
            Update
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="orders.length === 0">No orders for this restaurant.</p>
</div>
