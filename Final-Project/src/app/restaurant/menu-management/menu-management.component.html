<div class="card p-3 mb-4">
  <h4>Menu Items</h4>

  <form [formGroup]="menuForm" (ngSubmit)="addOrUpdateMenu()" class="mb-3">
    <input type="text" formControlName="name" placeholder="Name" class="form-control mb-2"/>
    <input type="text" formControlName="description" placeholder="Description" class="form-control mb-2"/>
    <input type="number" formControlName="price" placeholder="Price" class="form-control mb-2"/>
    <label><input type="checkbox" formControlName="isAvailable"/> Available</label>
    <button class="btn btn-primary mt-2">{{ editingMenuItemId ? 'Update' : 'Add' }}</button>
  </form>

  <table class="table table-bordered" *ngIf="menuItems.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Available</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of menuItems">
        <td>{{ item.name }}</td>
        <td>{{ item.description }}</td>
        <td>₹{{ item.price }}</td>
        <td>{{ item.isAvailable ? 'Yes' : 'No' }}</td>
        <td>
          <button class="btn btn-sm btn-info" (click)="editMenuItem(item)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteMenuItem(item.menuItemId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="menuItems.length === 0">No available menu items.</p>
</div>
