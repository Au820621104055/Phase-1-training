<div class="container mt-4">


  <div class="card p-3 mb-4">
    <h4>{{ editingUserId ? 'Edit User' : 'Add User' }}</h4>
    <form [formGroup]="userForm" (ngSubmit)="addOrUpdateUser()">

      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" formControlName="name" class="form-control" placeholder="Enter full name">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="Enter email">
      </div>

      <div class="mb-3">
        <label for="role" class="form-label">Role</label>
        <select id="role" formControlName="role" class="form-select">
          <option value="Customer">Customer</option>
          <option value="RestaurantOwner">Restaurant Owner</option>
          <option value="DeliveryStaff">Delivery Staff</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">
        {{ editingUserId ? 'Update User' : 'Add User' }}
      </button>

      <button type="button" class="btn btn-secondary ms-2" (click)="userForm.reset({ role: 'Customer' }); editingUserId = null;">
        Cancel
      </button>
    </form>
  </div>


  <div class="card p-3">
    <h4>All Users</h4>
    <table class="table table-bordered" *ngIf="users.length">
      <thead>
        <tr>
          <th>User ID</th>
          <th>Full Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Active</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.userId }}</td>
          <td>{{ user.fullName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>
            <span *ngIf="user.isActive; else inactive" class="badge bg-success">Active</span>
            <ng-template #inactive>
              <span class="badge bg-danger">Inactive</span>
            </ng-template>
          </td>
          <td>
            <button class="btn btn-sm btn-info me-1" (click)="editUser(user)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteUser(user.userId)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!users.length" class="text-center text-muted">
      No users found.
    </div>
  </div>

</div>
