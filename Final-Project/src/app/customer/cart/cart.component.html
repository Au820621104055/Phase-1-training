<div class="container mt-4">
  <h3 class="mb-4 text-center">Your Cart</h3>

  <div *ngIf="carts.length === 0" class="alert alert-info text-center">
    Your cart is empty. Go add some items!
  </div>

  <div *ngFor="let cart of carts; let ci = index" class="mb-4">
    <div class="card p-3 shadow-sm">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">{{ cart.restaurantName }}</h5>
        <button class="btn btn-success btn-sm" (click)="checkoutRestaurant(ci)">
          Proceed to Checkout
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered align-middle text-center mb-0">
          <thead class="table-light">
            <tr>
              <th>Item</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of cart.items; let i = index">
              <td>{{ c.item.name }}</td>
              <td>₹{{ c.item.price }}</td>
              <td>
                <div class="d-flex justify-content-center align-items-center">
                  <button class="btn btn-sm btn-secondary me-1" (click)="decreaseQty(ci, i)">-</button>
                  <span class="mx-2">{{ c.qty }}</span>
                  <button class="btn btn-sm btn-secondary ms-1" (click)="increaseQty(ci, i)">+</button>
                </div>
              </td>
              <td>₹{{ c.item.price * c.qty }}</td>
              <td>
                <button class="btn btn-sm btn-danger" (click)="removeItem(ci, i)">Remove</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Total Amount -->
      <div class="text-end mt-3">
        <strong>Total: ₹{{ getTotal(cart) }}</strong>
      </div>
    </div>
  </div>
</div>
