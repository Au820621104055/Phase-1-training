<div class="checkout-bg min-vh-100 p-0">
  <div class="container mt-3">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" routerLink="/">FoodieApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" routerLink="/customer/">Home</a></li>
            <li class="nav-item"><a class="nav-link" routerLink="/customer/restaurant-list">Restaurants</a></li>
            <li class="nav-item"><a class="nav-link" routerLink="/customer/cart">Cart</a></li>
            <li class="nav-item"><a class="nav-link" routerLink="/customer/orders">Orders</a></li>
            <li class="nav-item"><a class="nav-link" routerLink="/customer/customer-dashboard">Dashboard</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Checkout Content -->
    <div class="mt-4">
      <h2 class="text-center mb-4 text-white">Checkout</h2>

      <div *ngIf="cart.length === 0" class="alert alert-info text-center">
        Your cart is empty. Add items to proceed!
      </div>

      <div *ngIf="cart.length > 0">
        <!-- Delivery Details -->
        <div class="card dark-card shadow p-3 mb-4">
          <h4 class="text-white">Delivery Details</h4>
          <div class="mb-3">
            <label class="form-label text-white">Address</label>
            <textarea class="form-control dark-input" [(ngModel)]="address" placeholder="Enter delivery address"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label text-white">Special Instructions (Optional)</label>
            <textarea class="form-control dark-input" [(ngModel)]="specialInstructions" placeholder="E.g., no onion, extra spicy"></textarea>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="card dark-card shadow p-3 mb-4">
          <h4 class="text-white">Order Summary</h4>
          <ul class="list-group mb-3 dark-list-group">
            <li *ngFor="let c of cart" class="list-group-item d-flex justify-content-between align-items-center dark-list-item">
              {{ c.item.name }} x {{ c.qty }}
              <span>₹{{ c.item.price * c.qty }}</span>
            </li>
          </ul>
          <h5 class="text-end text-white">Total: ₹{{ total }}</h5>
        </div>

        <div class="text-center">
          <button class="btn btn-success btn-lg px-5" (click)="proceedToPayment()">Proceed to Payment</button>
        </div>
      </div>
    </div>
  </div>
</div>
