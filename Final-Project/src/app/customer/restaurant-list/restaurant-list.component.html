<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">FoodieApp</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" routerLink="/customer/">Home</a></li>
        <li class="nav-item"><a class="nav-link active" routerLink="/customer/restaurant-list">Restaurants</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/customer/cart">Cart</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/customer/orders">Orders</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/customer/customer-dashboard">Dashboard</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Page Content -->
<div class="restaurant-bg p-4">
  <h2 class="text-center mb-3 text-white">Restaurants</h2>
  <hr class="text-light">

  <!-- Search -->
  <div class="mb-3 position-relative">
    <input
      type="text"
      class="form-control search-input"
      placeholder="Search by name or cuisine"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange($event)"
    />
    <button class="btn btn-primary position-absolute top-0 end-0 mt-1 me-1" (click)="goToCart()">
      Go to Cart
    </button>
  </div>

  <!-- Restaurant Cards -->
  <div class="row">
    <div *ngFor="let restaurant of filteredRestaurants" class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm">
        <img [src]="restaurant.image" class="card-img-top" alt="{{ restaurant.name }}">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ restaurant.name }}</h5>
          <p class="card-text text-muted">{{ restaurant.cuisineType }}</p>
          <button class="btn btn-primary mt-auto w-100" (click)="viewDetails(restaurant.restaurantId)">
            View Menu
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading / Error -->
  <div *ngIf="loading" class="text-center mt-3 text-white">Loading restaurants...</div>
  <div *ngIf="error" class="text-center mt-3 text-danger">{{ error }}</div>
</div>
