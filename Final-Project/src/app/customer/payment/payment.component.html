<div class="container mt-5">
  <h2 class="text-center mb-4">Payment</h2>

  <div class="card shadow p-3 mb-4">
    <h4>Order Summary</h4>
    <ul class="list-group mb-3">
      <li *ngFor="let c of cart" class="list-group-item d-flex justify-content-between align-items-center">
        {{ c.item.name }} x {{ c.qty }}
        <span>₹{{ c.item.price * c.qty }}</span>
      </li>
    </ul>
    <h5 class="text-end">Total: ₹{{ total }}</h5>
  </div>

  <div class="card shadow p-3">
    <h4>Select Payment Method</h4>
    <select [(ngModel)]="paymentMethod" class="form-select mb-3">
      <option value="COD">Cash on Delivery (COD)</option>
      <option value="UPI">UPI</option>
      <option value="Card">Credit/Debit Card</option>
    </select>

    <div *ngIf="paymentMethod==='UPI'" class="mb-3">
      <p>Scan the QR or use UPI ID: <strong>example@upi</strong></p>
    </div>

    <div *ngIf="paymentMethod==='Card'" class="mb-3">
      <input type="text" class="form-control mb-2" placeholder="Card Number">
      <input type="text" class="form-control mb-2" placeholder="Expiry MM/YY">
      <input type="text" class="form-control mb-2" placeholder="CVV">
    </div>

    <div class="text-center mt-3">
      <button class="btn btn-success btn-lg px-5" (click)="pay()">Pay / Place Order</button>
    </div>
  </div>
</div>
