<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment - Yummy Tummy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <style>
    body {
      background-image: url(image/order.jpeg);
      background-size: contain;
      background-attachment: fixed;
    }
    .payment-box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: rgb(14, 13, 13);
      color: white;
      text-align: center;
      padding: 1px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="home.html">Yummy Tummy</a>
    <span class="navbar-text text-white">Payment</span>
  </nav>

  <div class="payment-box">
    <h3 class="text-center">Order Summary</h3>
    <div id="orderSummary"></div>
    <p class="fw-bold text-center mt-3" id="totalPrice"></p>

    <div class="text-center mt-4">
      <button class="btn btn-success" onclick="placeOrder()">Pay Now</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Yummy Tummy</p>
  </footer>

  <script>
    const cart = JSON.parse(sessionStorage.getItem("cart") || "[]");
    const orderDiv = document.getElementById("orderSummary");
    let total = 0;

    function displayOrder() {
      if (cart.length === 0) {
        orderDiv.innerHTML = "<p class='text-center'>Your cart is empty.</p>";
        document.getElementById("totalPrice").innerText = "";
        return;
      }

      let html = "<ul class='list-group'>";
      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        html += `
          <li class="list-group-item d-flex justify-content-between align-items-center">
            ${item.name} × ${item.qty}
            <span>₹${itemTotal}</span>
          </li>
        `;
      });
      html += "</ul>";
      orderDiv.innerHTML = html;
      document.getElementById("totalPrice").innerText = "Total: ₹" + total;
    }

    displayOrder();

    function generateOrderId() {
      const randomPart = Math.floor(Math.random() * (9000 - 1000 + 1)) + 1000;
      return "ord" + randomPart;
    }

    function placeOrder() {
      if (cart.length === 0) {
        alert("Cart is empty. Cannot place order.");
        return;
      }

      const orderId = generateOrderId();
      const date = new Date().toLocaleString();

      const order = {
        id: orderId,
        date: date,
        items: cart,
        total: total
      };

      // Save to Admin (localStorage)
      let allOrders = JSON.parse(localStorage.getItem("orders") || "[]");
      allOrders.push(order);
      localStorage.setItem("orders", JSON.stringify(allOrders));

      // Save to User (sessionStorage)
      let myOrders = JSON.parse(sessionStorage.getItem("myOrders") || "[]");
      myOrders.push(order);
      sessionStorage.setItem("myOrders", JSON.stringify(myOrders));

      // Clear cart
      sessionStorage.removeItem("cart");

      alert("Payment Successful!\nOrder ID: " + orderId);
      window.location.href = "order.html";
    }
  </script>

</body>
</html>
