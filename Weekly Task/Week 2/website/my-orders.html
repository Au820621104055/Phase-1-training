<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders - Yummy Tummy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<style>
  body{
    background-image: url(image/bg.jpeg);
    background-size: cover;
    background-attachment: fixed;
  }
</style>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="home.html">Yummy Tummy</a>
    <span class="navbar-text text-white">My Orders</span>
  </nav>

  <!-- Orders Section -->
  <div class="container mt-4">
    <h2 class="text-center text-white mb-4">My Orders</h2>
    <div id="ordersList"></div>
  </div>

  <!-- Script -->
  <script>
    const myOrders = JSON.parse(sessionStorage.getItem("myOrders") || "[]");
    const div = document.getElementById("ordersList");

    if (myOrders.length === 0) {
      div.innerHTML = "<p class='text-center'>You have no past orders.</p>";
    } else {
      let html = "";
      myOrders.forEach(order => {
        html += `
          <div class="card mb-3">
            <div class="card-header">
              <strong>Order ID:</strong> ${order.id} | <strong>Date:</strong> ${order.date}
            </div>
            <div class="card-body">
              <ul>`;
        order.items.forEach(i => {
          html += `<li>${i.name} - Qty: ${i.qty} - ₹${i.price * i.qty}</li>`;
        });
        html += `</ul>
              <p><strong>Total: ₹${order.total}</strong></p>
            </div>
          </div>`;
      });
      div.innerHTML = html;
    }
  </script>

</body>
</html>
