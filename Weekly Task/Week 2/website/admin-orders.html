<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Orders - Yummy Tummy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <style>
    body {
      background-color: #f8f9fa;
    }
    footer {
      position: relative;
      bottom: 0;
      width: 100%;
      background-color: rgb(14, 13, 13);
      color: white;
      text-align: center;
      padding: 1px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="home.html">Yummy Tummy - Admin</a>
    <div>
      <a href="admin-orders.html" class="btn btn-outline-light btn-sm me-2">View Orders</a>
      <a href="home.html" class="btn btn-outline-light btn-sm">Log Out</a>
    </div>
  </nav>

  <!-- Title & Search -->
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>All Orders</h4>
      <input type="text" id="searchInput" class="form-control w-50" placeholder="Search by Order ID or Item Name" onkeyup="filterOrders()" />
    </div>

    <div id="ordersContainer"></div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Yummy Tummy</p>
  </footer>

  <!-- Script -->
  <script>
    let orders = JSON.parse(localStorage.getItem("orders") || "[]");

    function displayOrders() {
      const container = document.getElementById("ordersContainer");
      if (orders.length === 0) {
        container.innerHTML = "<p class='text-center'>No orders found.</p>";
        return;
      }

      let html = "";
      orders.forEach(order => {
        const orderId = order.id || "N/A";
        const orderDate = order.date || "Unknown";

        let itemsHtml = "";
        if (order.items && Array.isArray(order.items)) {
          itemsHtml = order.items.map(item => {
            const itemTotal = item.price * item.qty;
            return `<li>${item.name} - ₹${item.price} × ${item.qty} = ₹${itemTotal}</li>`;
          }).join("");
        } else {
          itemsHtml = "<li>No items found.</li>";
        }

        html += `
          <div class="card mb-3 order-item">
            <div class="card-body">
              <h5>Order ID: ${orderId}</h5>
              <p><strong>Date:</strong> ${orderDate}</p>
              <ul>${itemsHtml}</ul>
              <p class="fw-bold">Total: ₹${order.total}</p>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterOrders() {
      const keyword = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll(".order-item");

      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(keyword) ? "" : "none";
      });
    }

    displayOrders();
  </script>

</body>
</html>
